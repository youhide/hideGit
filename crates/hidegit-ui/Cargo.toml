[package]
name = "hidegit-ui"
description = "iced screens, widgets, theme and the commit-graph canvas for hideGit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
hidegit-core = { workspace = true, features = ["fake"] }
hidegit-forge = { workspace = true, features = ["fake"] }
iced = { workspace = true, features = ["canvas", "tokio", "advanced", "highlighter"] }
rfd = "0.15"
tokio = { version = "1", features = ["rt", "time"] }
time = { workspace = true, features = ["formatting", "local-offset", "macros"] }
tracing.workspace = true
open = "5.4.0"
# Custom themes are TOML files in the config directory. Parsed here rather than
# in the shell so the field list stays next to the `Palette` it fills in.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
iced_runtime = "0.14"
iced_test = "0.14"
tempfile = "3"
