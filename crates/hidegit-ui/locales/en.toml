# hideGit's user-facing text, in English.
#
# This is the source: the code carries keys, this file carries strings, and it
# is compiled into the binary as the fallback for every other language. To
# translate, copy it to `locales/<tag>.toml` beside your `config.toml`, replace
# the values, and leave the keys alone. Anything you have not translated shows
# in English rather than as a key, and hideGit says how many are left.
#
# The translations hideGit ships live beside this file and are compiled in too.
# A file of the same name in your own `locales` directory still wins — yours is
# a correction or a work in progress, and being overruled by the binary is the
# one thing that would make writing one pointless.
#
# **A shipped translation may not have holes.** A contributor's own file may be
# half-finished and shows English where it is; one that ships would show a
# mixture of two languages to somebody with no file to fix. A test enforces it.
#
# See docs/adr/0008-translations-as-toml-catalogues.md.
#
# **Not everything the interface shows is here, yet.** The catalogue was added
# in M6 with the settings panel converted to prove it; the rest of the screens
# still carry their strings inline. New user-facing text goes here.
#
# What never belongs here: Git's own output, which reaches the user verbatim on
# purpose, and anything that came out of a repository — branch names, paths,
# remote URLs, commit messages.

# ---- The settings panel --------------------------------------------------

"settings.title" = "Settings"
"settings.done" = "Done"

# The footer says whether the last change reached config.toml. Both halves
# matter: a toggle that flips while the file refused the write is the bug the
# footer exists to make visible.
"settings.saved" = "Saved to config.toml as you change it."
"settings.not-saved" = "Not saved — "

"settings.section.appearance" = "Appearance"
"settings.section.window" = "Window"
"settings.section.diagnostics" = "Diagnostics"
"settings.section.alerts" = "Pull request alerts"
"settings.section.muted" = "Muted repositories"

"settings.window.remember" = "Reopen at the last size and position"
# Says what "off" means, which is otherwise a guess: not "wherever the window
# manager feels like", but a fixed default.
"settings.window.remember.off" = "Off, hideGit opens at its default size, centred."

"settings.diagnostics.reports" = "Write a report when something goes wrong"
"settings.diagnostics.reports.note" = "Saved on this machine. Nothing is ever sent anywhere."
"settings.diagnostics.updates" = "Check for a newer hideGit"
"settings.diagnostics.updates.note" = "Asks github.com once a day. Never installs anything."

"settings.quiet.title" = "Quiet hours"
"settings.quiet.from" = "from"
"settings.quiet.to" = "to"
# Shown when the two ends are equal, because that window covers nothing — which
# is the only reading that does not silence either everything or nothing.
"settings.quiet.empty" = "A window that starts and ends at the same hour silences nothing."

# Shown when no repository can be named yet, so the list is not an empty box.
"settings.muted.none" = "Repositories appear here once one is open with a GitHub remote, or is muted in config.toml."

# ---- Themes --------------------------------------------------------------
#
# The two that ship are labelled rather than keyed: `hidegit-dark` is a config
# name nobody chose. A custom theme is shown by its file name, untranslated,
# because somebody chose that.

"theme.dark" = "Dark"
"theme.light" = "Light"

# ---- Empty states --------------------------------------------------------
#
# `UI_SPEC.md` asks an empty state to carry the next action rather than only
# describing the absence, so these come in pairs: what is true, and the button
# that does something about it.

"empty.nothing-to-commit" = "Nothing to commit — the working directory matches the last commit."
"empty.show-last-commit" = "Show the last commit"

"empty.no-file-matches" = "No file matches that."
"empty.clear-filter" = "Clear the filter"
