# O texto da hideGit, em português do Brasil.
#
# Traduzido do arquivo ao lado, `en.toml`, que é a fonte: o código carrega as
# chaves, estes arquivos carregam as frases. Uma chave que não estiver aqui
# aparece em inglês, e a hideGit diz quantas faltam.
#
# Veja docs/adr/0008-translations-as-toml-catalogues.md.
#
# **O vocabulário do Git fica em inglês.** `commit`, `stash`, `rebase`, `pull
# request`, `remote` — quem aprende uma palavra aqui precisa conseguir usá-la no
# terminal e na documentação do próprio Git, e traduzi-las ensinaria um
# vocabulário que não serve em lugar nenhum. Nomes de arquivos que o usuário vê
# — `config.toml` — também ficam, porque são o nome real do arquivo em disco.
#
# O que nunca entra aqui: a saída do próprio Git, que chega ao usuário
# literalmente de propósito, e qualquer coisa que veio de um repositório —
# nomes de branch, caminhos, URLs de remote, mensagens de commit.

