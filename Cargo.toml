[workspace]
members = [
    "crates/hidegit",
    "crates/hidegit-core",
    "crates/hidegit-forge",
    "crates/hidegit-ui",
    "xtask",
]
# `xtask` is build tooling, invoked explicitly with `-p xtask`. Excluding it
# from the default set keeps a bare `cargo build` from compiling an image
# pipeline nobody asked for.
default-members = [
    "crates/hidegit",
    "crates/hidegit-core",
    "crates/hidegit-forge",
    "crates/hidegit-ui",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
# Raised from 1.85 in M4. `octocrab` itself declares 1.85, but it depends on
# `jsonwebtoken`, which reaches `time 0.3.47`, which needs 1.88 — so the
# effective floor is set by a transitive dependency rather than by anything
# hideGit writes. Stated here because the number is otherwise unexplainable.
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/youhide/hideGit"
authors = ["The hideGit contributors"]

# Only the load-bearing versions are pinned deliberately; see
# docs/ARCHITECTURE.md#third-party-crates.
[workspace.dependencies]
hidegit-core = { path = "crates/hidegit-core", version = "0.0.1" }
hidegit-forge = { path = "crates/hidegit-forge", version = "0.0.1" }
hidegit-ui = { path = "crates/hidegit-ui", version = "0.0.1" }

# No network-transport feature is enabled: gitoxide is the read half only, and
# every network operation shells out to `git`. See ADR-0002.
# `blame` is not a default feature and pulls in the blob-diff machinery. It is
# on because M6's blame view is a read, and reads go through gitoxide.
gix = { version = "0.86", features = ["blame"] }
iced = "0.14"
# The filesystem watcher behind automatic status refresh. Debounced: an editor
# save is several events, and a `git` command is hundreds.
notify-debouncer-full = "0.6"
thiserror = "2"
time = "0.3"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
