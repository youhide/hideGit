name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The benchmarks are the only job worth running on a timer: nothing about
  # them depends on a change having been pushed.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is platform-independent, so it runs once rather than three times.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # clippy and the test suite run on all three platforms: the subprocess
  # boundary and the windowing stack genuinely differ between them.
  check:
    name: clippy & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux windowing and font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The test suite builds fixture repositories with the system `git`, so
      # its identity has to be set for `git commit` to succeed on a clean runner.
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "hideGit CI"
          git config --global user.email "ci@hidegit.invalid"
          git config --global init.defaultBranch main

        # --workspace, because the workspace sets default-members to exclude
        # xtask from ordinary builds — and dev tooling still has to lint.
        #
        # --locked, because `release.yml` uses it: without it here, CI passes on
        # a dependency set resolved fresh that afternoon while the release
        # builds `Cargo.lock`, and the first place they can disagree is a tag.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  # The floor `Cargo.toml` declares. Nothing else checks it: clippy's
  # `incompatible_msrv` catches a standard-library call that is too new — it
  # caught one in the panic hook — but it says nothing about whether the crate
  # graph resolves and compiles on 1.88 at all.
  #
  # `cargo check` rather than `test`: what is under test is the toolchain
  # accepting the code, and the suite already runs three times over on stable.
  msrv:
    name: rust 1.88 (the declared floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux windowing and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      # Pinned exactly, not `1.88` — a patch release of the same minor can
      # stabilise something, and then this job stops meaning what it says.
      - uses: dtolnay/rust-toolchain@1.88.0

      # No cache here, deliberately. This job takes two minutes from cold, and a
      # restored `target/` is the one variable that could let it report a pass
      # on something it never compiled — which is the only failure mode a
      # version gate has.
      #
      # `RUSTUP_TOOLCHAIN` is not belt-and-braces: `rust-toolchain.toml` at the
      # repository root pins `channel = "stable"`, and rustup honours a
      # directory override *above* the default this action just set. Without
      # this line the job installs 1.88, reports installing 1.88, and then
      # compiles everything with stable — a green check proving nothing. Only
      # the environment variable outranks the file.
      - run: cargo check --workspace --all-targets --all-features --locked
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"

  # The profile people actually download, which nothing built until a tag.
  # `lto = "thin"` and the optimiser are a different compilation entirely, and
  # `release.yml` only runs on `v*` — so the first sign of a release-only break
  # was the release.
  #
  # One platform: what this catches is optimisation and LTO, which are not
  # platform-specific. The three-way matrix stays on the debug build, where it
  # is testing the subprocess boundary and the windowing stack instead.
  release-profile:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux windowing and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --workspace --release --locked

  # Benchmarks, on Linux only: the numbers are not compared between platforms
  # and running the 100,000-commit fixture three times over buys nothing.
  #
  # **Timings are not gated and cannot be.** A shared runner is two to three
  # times slower on a bad minute, so failing a pull request on a 40% regression
  # would mean failing pull requests at random. What is gated is a *ratio* —
  # two benchmarks from the same run on the same machine, which divides the
  # machine out. See `xtask/src/bench.rs`.
  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The fixture is a hundred thousand commits built with `git fast-import`,
      # which will not run without an identity.
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "hideGit CI"
          git config --global user.email "ci@hidegit.invalid"
          git config --global init.defaultBranch main

      # `--quick` on a pull request, which is about half a minute of measurement
      # rather than five, and enough for a ratio two orders of magnitude wide.
      # The full run happens on main and on the weekly schedule.
      - name: Run the benchmarks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo bench -p hidegit-core --bench graph -- --quick
          else
            cargo bench -p hidegit-core --bench graph
          fi

      - name: Check what they measured
        run: cargo run -p xtask -- bench-check

      # Kept because the numbers in docs/COMMIT_GRAPH.md are measured on a known
      # machine, and a run from a runner is the only way to see the trend
      # between the times somebody re-measures by hand.
      - name: Keep the results
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.run_id }}
          path: target/criterion
          retention-days: 30
